<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2E9DA">
<meta name="description" content="Ink Swing — swing, release, paint a poster.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ink Swing</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/ArchivoBlack-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="Toggle sound" aria-pressed="false">🔊</button>
<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="pal" class="pill">Bauhaus</div>
  <div id="toast"></div>
</div>
<div id="hint" class="hidden"><div class="hand"></div><b>HOLD</b> to grab a pin<br><b>RELEASE</b> to fling</div>

<section id="start" class="panel show homeB">
  <div class="hb-top"><button class="hb-pill" id="btnTheme"></button><button class="hb-pill hb-trophy" id="btnLeaders" aria-label="Leaderboard">🏆</button></div>
  <h1 class="hb-logo"><img src="img/logo-B.webp" alt="Ink Swing" width="900" height="561"></h1>
  <p class="hb-tag">Hold to grab. Release to fling. Paint a poster.</p>
  <button class="hb-play" id="btnRandom"><i></i>PLAY</button>
  <div class="hb-modes">
    <button class="hb-card" id="btnDaily" style="--c:#1F4FA8"><b><span><span class="hw-only">🎃 </span>Daily Seed</span></b><small id="dailyTag"></small></button>
    <button class="hb-card" id="btnChill" style="--c:#F4C430" aria-pressed="false"><b><span><span class="hw-only">👻 </span>Chill Mode</span> <em id="chillState">OFF</em></b><small id="chillSub">No obstacles, just paint</small></button>
  </div>
  <div class="hb-stats"><div><span id="bestLabel">BEST</span><b id="bestStart">0</b></div>
    <button class="hb-pal" id="hbPal" aria-haspopup="dialog" aria-label="Choose palette"><span id="palLabel">PALETTE · BAUHAUS</span><div id="palDots"></div></button></div>
  <div class="hb-swing" aria-hidden="true"></div>
  <div class="hb-foot"><span class="native-only"><button class="hb-link" id="btnRemoveAds"><b>Remove Ads</b></button> · <button class="hb-link" id="btnRestore">Restore</button></span><span class="hb-hint">Touch &amp; hold to play</span></div>
</section>
<div id="picker" class="hb-sheet" hidden role="dialog" aria-label="Palette"><div class="hb-sheet-in pk-in"><h3>Palette</h3><div id="pkList" class="pk-list"></div>
  <div id="pkCustom" class="pk-custom" hidden><h3>Custom</h3><div id="pkSlots" class="pk-slots"></div>
    <label>Hue<input type="range" id="pkHue" min="0" max="359" class="pk-hue"></label><label>Lightness<input type="range" id="pkLight" min="5" max="95"></label>
    <p id="pkWarn" class="pk-warn"></p><div class="pk-row"><button class="hb-link" id="pkFix" hidden>Fix contrast</button><button class="hb-link" id="pkCancel">Cancel</button><button class="hb-play pk-save" id="pkSave">Use these</button></div></div>
  <button class="hb-play hb-close" id="pkClose">Done</button></div></div>
<div id="scores" class="hb-sheet" hidden><div class="hb-sheet-in"><h3>Best Scores</h3><ul id="scoreList"></ul><button class="hb-play hb-close" id="btnScoresClose">Close</button></div></div>

<section id="over" class="panel">
  <p class="kicker" id="overMode">Random run</p>
  <h2>INKED<br>OUT</h2>
  <div class="final" id="finalScore">0</div>
  <p class="best" id="overBest">Best 0</p>
  <img id="posterPrev" alt="Your poster">
  <div class="row">
    <button class="btn" id="btnRetry">Retry</button>
    <button class="btn alt" id="btnShare">Share Poster</button>
  </div>
  <button class="link" id="btnMenu">Menu</button>
</section>
<script src="game.js"></script>
<script src="home-brush.js"></script>
</body>
</html>
